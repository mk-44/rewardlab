run_name: run
out_dir: experiments/reward_model/probe_minilm

data:
  train_path: preference_data/train.jsonl
  val_path: preference_data/val.jsonl
  format: pairwise

model:
  backbone: sentence-transformers/all-MiniLM-L6-v2
  pooling: mean
  max_length: 512
  template: "{response}"
  freeze: true

train:
  epochs: 3
  batch_size: 32
  accm_steps: 1
  eval_batch_size: 128
  lr: 0.001
  weight_decay: 0.01
  sched: cosine
  warmup_steps: 50
  clip_norm: 1.0
  log_every: 50
  eval_every: 500
  early_stop_patience: 4
  keep_last: 2

execution:
  device: mps
  dtype: float32
  seed: 0
