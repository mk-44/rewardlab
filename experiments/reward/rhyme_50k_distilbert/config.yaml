run_name: run
out_dir: experiments/reward/rhyme_50k_distilbert
reports_dir: data/preference_data/rhyme_50k/reports

data:
  train_path: data/preference_data/rhyme_50k/train.jsonl
  val_path: data/preference_data/rhyme_50k/val.jsonl
  format: pairwise
  slice_keys: [domain, len_bucket, near_miss, batch]

model:
  backbone: distilbert-base-uncased
  pooling: mean
  max_length: 64
  template: "{response}"

train:
  epochs: 4
  batch_size: 16
  accm_steps: 1
  eval_batch_size: 128
  lr: 0.00003
  weight_decay: 0.01
  sched: cosine
  warmup_steps: 200
  clip_norm: 1.0
  log_every: 100
  eval_every: 500
  early_stop_patience: 4
  keep_last: 2
  resume_state: latest

execution:
  device: mps
  weights_dtype: float32
  compute_dtype: float32
  seed: 0
