run_name: run
out_dir: experiments/reward/rhyme_10k_distilbert
reports_dir: data/preference_data/rhyme_10k/reports

data:
  train_path: data/preference_data/rhyme_10k/train.jsonl
  val_path: data/preference_data/rhyme_10k/val.jsonl
  format: pairwise
  slice_keys: [domain, len_bucket, near_miss]

model:
  backbone: distilbert-base-uncased
  pooling: mean
  max_length: 64
  template: "{response}"

train:
  epochs: 4
  batch_size: 16
  accm_steps: 1
  eval_batch_size: 128
  lr: 0.00003
  weight_decay: 0.01
  sched: cosine
  warmup_steps: 100
  clip_norm: 1.0
  log_every: 50
  eval_every: 243
  early_stop_patience: 4
  keep_last: 2

execution:
  device: mps
  dtype: float32
  seed: 0
